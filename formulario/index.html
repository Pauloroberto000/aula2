<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Preços</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #5a0202;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 2rem;
    }

    .pricing-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Para fallback */
      background: #fcfcfc;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(20, 4, 110, 0.1);
      width: 250px;
      height: 400px; /* Altura fixa só para demonstração */
    }

    .pricing-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .features {
      list-style: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
    }

    .features li {
      margin-bottom: 0.5rem;
      padding-left: 1rem;
      position: relative;
    }

    .features li::before {
      content: '✔';
      position: absolute;
      left: 0;
      color: green;
    }

    .buy-button {
      margin-top: auto; /* ESSENCIAL: empurra o botão para o final */
      padding: 0.75rem 1rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: background 0.3s;
    }

    .buy-button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="pricing-card">
    <div class="pricing-title">Básico</div>
    <ul class="features">
      <li>1 Usuário</li>
      <li>Suporte Básico</li>
      <li>5GB de Armazenamento</li>
    </ul>
    <button class="buy-button">Comprar</button>
  </div>

  <div class="pricing-card">
    <div class="pricing-title">Premium</div>
    <ul class="features">
      <li>10 Usuários</li>
      <li>Suporte Prioritário</li>
      <li>100GB de Armazenamento</li>
      <li>Integração com API</li>
      <li>Relatórios Avançados</li>
    </ul>
    <button class="buy-button">Comprar</button>
  </div>

</body>
</html>
